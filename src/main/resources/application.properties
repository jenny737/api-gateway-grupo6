server.port=8070
spring.application.name=api-gateway-grupo-6

spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.routes[0].id=matricula-service
spring.cloud.gateway.routes[0].uri=lb://MATRICULA-SERVICE-GRUPO-6
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/matriculas/**

spring.cloud.gateway.routes[1].id=curso-service
spring.cloud.gateway.routes[1].uri=lb://CURSO-SERVICE-GRUPO-6
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/cursos/**